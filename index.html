<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VidShare — share videos from your phone in seconds. No signup required. Optional account to manage uploads. Optional password and auto-expiry.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="VidShare — Share your video">
    <meta property="og:description" content="Upload a video or paste a link and get a shareable URL instantly. No signup required.">
    <meta property="og:image" content="/assets/vidshare-og.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="576">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="VidShare — Share your video">
    <meta name="twitter:description" content="Upload a video or paste a link and get a shareable URL instantly. No signup required.">
    <meta name="twitter:image" content="/assets/vidshare-og.png">
    <title>VidShare — Share videos in seconds</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='1' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M22 18 L46 32 L22 46 Z' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles/common.css">
    <link rel="stylesheet" href="/styles/upload.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at top, rgba(78,205,196,0.08), transparent 60%),
                        radial-gradient(ellipse at bottom, rgba(255,107,107,0.06), transparent 60%),
                        #0a0a0a;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 28px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }
        .nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .nav a.nav-link {
            color: #ccc;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 10px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .nav a.nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 24px 60px;
        }

        /* Hero */
        .hero {
            text-align: center;
            max-width: 720px;
            margin-top: 40px;
        }
        .hero h1 {
            font-size: clamp(2.4rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.05;
            margin-bottom: 20px;
        }
        .hero h1 .accent {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .sub {
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            color: #aaa;
            line-height: 1.55;
            max-width: 560px;
            margin: 0 auto 32px;
            font-weight: 300;
        }
        .hero-drop {
            border: 2px dashed #3a3a3c;
            border-radius: 18px;
            padding: 36px 32px;
            max-width: 420px;
            margin: 0 auto 18px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            text-align: center;
            min-height: 176px;
            box-sizing: border-box;
            display: grid;
        }
        .hero-drop:hover,
        .hero-drop.drag-over {
            border-color: rgba(78,205,196,0.6);
            background: rgba(78,205,196,0.04);
        }
        .hero-drop-icon {
            width: 36px; height: 36px;
            margin: 0 auto 14px;
            opacity: 0.5;
        }
        .hero-drop:hover .hero-drop-icon,
        .hero-drop.drag-over .hero-drop-icon {
            opacity: 0.8;
        }
        .hero-drop-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }
        .hero-drop-sub {
            font-size: 0.85rem;
            color: #888;
        }
        .hero-upload-content,
        .hero-link-content {
            grid-column: 1;
            grid-row: 1;
            transition: opacity 0.18s ease, visibility 0.18s ease;
        }
        .hero-link-content {
            opacity: 0;
            visibility: hidden;
        }
        .hero-link-content .hero-drop-icon {
            margin-bottom: 6px;
        }
        .hero-link-content .hero-drop-label {
            margin-bottom: 0;
        }
        .hero-drop.hero-link-mode .hero-upload-content {
            opacity: 0;
            visibility: hidden;
        }
        .hero-drop.hero-link-mode .hero-link-content {
            opacity: 1;
            visibility: visible;
        }
        .hero-drop.hero-link-mode {
            cursor: default;
        }
        .hero-link-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            width: 100%;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }
        .hero-link-input {
            flex: 1;
            min-width: 0;
            padding: 8px 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }
        .hero-link-input::placeholder {
            color: #666;
        }
        .hero-link-input:focus {
            border-color: rgba(78,205,196,0.6);
        }
        .hero-link-detected {
            font-size: 0.82rem;
            margin-top: 6px;
            color: #888;
        }
        .hero-link-detected.error {
            color: #ff6b6b;
        }
        .hero-link-detected:empty {
            display: none;
        }
        .hero-drop input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }
        .hero-or-link {
            text-align: center;
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: #888;
        }
        .hero-or-link a {
            color: #4ecdc4;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .hero-or-link a:hover { text-decoration: underline; }
        .hero-drop.reject {
            border-color: #ff6b6b;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .trust-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.95rem;
            color: #d0d0d0;
            margin-top: 36px;
        }
        .trust-row span::before {
            content: "✓ ";
            color: #4ecdc4;
            font-weight: 700;
        }


        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px 24px;
            color: #959595;
            font-size: 0.82rem;
        }
        footer a { color: #959595; text-decoration: none; }
        footer a:hover { color: #ccc; }

        @media (max-width: 600px) {
            .nav { padding: 16px 16px; }
            .nav .logo { font-size: 1.3rem; }
            main { padding: 16px 16px 40px; }
            .hero { margin-top: 18px; }
            .hero h1 { margin-bottom: 16px; }
            .hero-drop { padding: 28px 20px; min-height: 156px; }
            .hero-drop-sub { display: none; }
            .trust-row { gap: 12px; font-size: 0.85rem; }
            footer { padding: 30px 16px max(20px, env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/" class="logo">VidShare</a>
        <div style="display:flex; align-items:center; gap:8px;">
            <a href="/login" class="nav-link" id="navAuth" style="display:none;">Sign in</a>
            <a href="/account" class="nav-link" id="navAccount" style="display:none;">My videos</a>
        </div>
    </nav>
    <script src="/js/index-nav.js"></script>

    <main>
        <section class="hero">
            <h1>Upload and share your <span class="accent">video</span> instantly</h1>
            <p class="sub">
                ... or paste a link from sites like YouTube or Dropbox.
            </p>
            <div class="hero-drop" id="heroDropZone" role="button" aria-label="Upload a video — click to browse or drag and drop" tabindex="0" style="position:relative;">
                <div class="hero-upload-content">
                    <input type="file" accept="video/*" id="heroFileInput" tabindex="-1">
                    <svg class="hero-drop-icon" viewBox="0 0 24 24" fill="none" stroke="#4ecdc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 16V4M12 4l-5 5M12 4l5 5"/>
                        <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
                    </svg>
                    <div class="hero-drop-label">Upload a Video</div>
                    <div class="hero-drop-sub">Click to browse or drag and drop a video file</div>
                </div>
                <div class="hero-link-content">
                    <svg class="hero-drop-icon" viewBox="0 0 24 24" fill="none" stroke="#4ecdc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <div class="hero-drop-label">Paste a video link</div>
                    <div class="hero-link-row">
                        <input type="url" class="hero-link-input" id="heroLinkInput"
                               placeholder="YouTube, Vimeo, Dailymotion, Loom, or Wistia URL"
                               autocomplete="off" spellcheck="false" aria-label="Video URL">
                    </div>
                    <div class="hero-link-detected" id="heroLinkDetected" aria-live="polite"></div>
                </div>
            </div>
            <p class="hero-or-link">or <a id="heroLinkBtn">paste a video link</a></p>
            <div class="trust-row">
                <span>No signup required</span>
                <span>No watermark</span>
                <span>Up to 1&nbsp;GB</span>
            </div>

        </section>
    </main>

    <footer>
        <p>Powered by VidShare</p>
    </footer>

    <script src="/js/link-parser.js"></script>
    <script src="/lib/qrcode-generator.js"></script>
    <script src="/js/thumbnail-capture.js"></script>
    <script src="/js/upload-widget.js"></script>
    <script src="/js/upload-modal.js"></script>
    <script src="/js/index-hero.js"></script>
</body>
</html>
