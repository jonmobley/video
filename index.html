<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VidShare — share videos from your phone in seconds. No signup required. Optional account to manage uploads. Optional password and auto-expiry.">
    <title>VidShare — Share videos in seconds</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='1' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M22 18 L46 32 L22 46 Z' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles/common.css">
    <link rel="stylesheet" href="/styles/upload.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(ellipse at top, rgba(78,205,196,0.08), transparent 60%),
                        radial-gradient(ellipse at bottom, rgba(255,107,107,0.06), transparent 60%),
                        #0a0a0a;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 28px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }
        .nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .nav a.nav-link {
            color: #ccc;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 10px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .nav a.nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 24px 60px;
        }

        /* Hero */
        .hero {
            text-align: center;
            max-width: 720px;
            margin-top: 40px;
        }
        .hero h1 {
            font-size: clamp(2.4rem, 6vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.05;
            margin-bottom: 20px;
        }
        .hero h1 .accent {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .sub {
            font-size: clamp(1rem, 2.2vw, 1.25rem);
            color: #aaa;
            line-height: 1.55;
            max-width: 560px;
            margin: 0 auto 32px;
            font-weight: 300;
        }
        .cta-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        /* Higher-specificity selectors (.btn.btn-primary) defeat
           common.css's .btn:hover { background: #0056CC } default. */
        .btn.btn-primary,
        .btn.btn-primary:hover {
            font-size: 1.05rem;
            padding: 16px 32px;
            border-radius: 14px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            color: #fff;
            border: none;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(78,205,196,0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn.btn-primary:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(78,205,196,0.35);
        }
        .btn.btn-primary:active { transform: translateY(0); filter: brightness(0.96); }

        .btn.btn-secondary,
        .btn.btn-secondary:hover {
            font-size: 1rem;
            padding: 16px 28px;
            border-radius: 14px;
            background: #1c1c1e;
            color: #fff;
            border: 1px solid #2c2c2e;
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }
        .btn.btn-secondary:hover {
            background: #2c2c2e;
            border-color: #3a3a3c;
            transform: translateY(-1px);
        }

        .trust-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.95rem;
            color: #d0d0d0;
            margin-top: 18px;
        }
        .trust-row span::before {
            content: "✓ ";
            color: #4ecdc4;
            font-weight: 700;
        }

        .hero.drag-active {
            outline: 2px dashed rgba(78,205,196,0.5);
            outline-offset: 12px;
            border-radius: 20px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px 24px;
            color: #444;
            font-size: 0.82rem;
        }
        footer a { color: #666; text-decoration: none; }
        footer a:hover { color: #aaa; }

        @media (max-width: 600px) {
            .nav { padding: 16px 16px; }
            .nav .logo { font-size: 1.3rem; }
            main { padding: 16px 16px 40px; }
            .hero { margin-top: 18px; }
            .hero h1 { margin-bottom: 16px; }
            .hero .sub { margin-bottom: 24px; }
            .cta-row { flex-direction: column; align-items: stretch; }
            .btn.btn-primary,
            .btn.btn-primary:hover {
                width: 100%; padding: 16px 24px;
            }
            .trust-row { gap: 12px; font-size: 0.85rem; }
            footer { padding: 30px 16px max(20px, env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/" class="logo">VidShare</a>
        <div style="display:flex; align-items:center; gap:8px;">
            <a href="/login" class="nav-link" id="navAuth" style="display:none;">Sign in</a>
            <a href="/account" class="nav-link" id="navAccount" style="display:none;">My videos</a>
        </div>
    </nav>
    <script>
      // Show "Sign in" or "My videos" depending on session — non-blocking.
      fetch('/api/auth/me').then(r => {
        document.getElementById(r.ok ? 'navAccount' : 'navAuth').style.display = 'inline-block';
      }).catch(() => { document.getElementById('navAuth').style.display = 'inline-block'; });
    </script>

    <main>
        <section class="hero">
            <h1>Share a video in <span class="accent">seconds</span>.</h1>
            <p class="sub">
                Upload your video and get a clean shareable link. No signup required, no app to install — just drop a file and send the link.
            </p>
            <div class="cta-row">
                <a href="/upload" class="btn btn-primary" id="openUploadBtn">Upload a Video</a>
            </div>
            <div class="trust-row">
                <span>No signup required</span>
                <span>No watermark</span>
                <span>Up to 1&nbsp;GB</span>
            </div>

        </section>
    </main>

    <footer>
        <p>Powered by VidShare</p>
    </footer>

    <script src="/js/link-parser.js"></script>
    <script src="/lib/qrcode-generator.js"></script>
    <script src="/js/thumbnail-capture.js"></script>
    <script src="/js/upload-widget.js"></script>
    <script src="/js/upload-modal.js"></script>
    <script>
      (function () {
        const openBtn = document.getElementById('openUploadBtn');
        openBtn.addEventListener('click', function (e) {
          e.preventDefault();
          window.openUploadModal();
        });

        var hero = document.querySelector('.hero');
        hero.addEventListener('dragover', function (e) {
          e.preventDefault();
          hero.classList.add('drag-active');
        });
        hero.addEventListener('dragleave', function (e) {
          if (!hero.contains(e.relatedTarget)) hero.classList.remove('drag-active');
        });
        hero.addEventListener('drop', function (e) {
          e.preventDefault();
          hero.classList.remove('drag-active');
          var file = e.dataTransfer.files[0];
          if (file && file.type.startsWith('video/')) {
            window.openUploadModal(file);
          }
        });
      })();
    </script>
</body>
</html>
