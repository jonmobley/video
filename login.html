<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Sign in – VidShare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='1' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M22 18 L46 32 L22 46 Z' fill='url(%23g)'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; min-height: 100vh; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 20px;
    }
    .brand {
      display: inline-block; margin-bottom: 28px;
      font-size: 1.4rem; font-weight: 800; text-decoration: none;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card {
      width: 100%; max-width: 400px; background: #111;
      border: 1px solid #1c1c1e; border-radius: 20px; padding: 32px 28px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 6px; }
    .sub { font-size: 0.9rem; color: #888; margin-bottom: 22px; line-height: 1.4; }
    .sub strong { color: #ddd; font-weight: 600; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%; padding: 13px 14px; margin-bottom: 14px;
      background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 10px;
      color: #fff; font-size: 0.95rem; font-family: inherit; outline: none;
    }
    input:focus { border-color: #4ecdc4; }
    input.code-input {
      font-size: 1.5rem; letter-spacing: 0.4em; text-align: center;
      font-variant-numeric: tabular-nums; padding-left: 0.4em;
    }
    .submit-btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: filter 0.2s, transform 0.2s;
    }
    .submit-btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .link-btn {
      background: none; border: none; color: #4ecdc4; font-size: 0.85rem;
      cursor: pointer; font-family: inherit; padding: 8px 4px; margin-top: 12px;
    }
    .link-btn:hover { text-decoration: underline; }
    .link-btn:disabled { opacity: 0.5; cursor: not-allowed; text-decoration: none; }
    .error {
      margin-top: 12px; padding: 10px 14px; border-radius: 10px;
      background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3);
      color: #ff8e8e; font-size: 0.85rem; display: none;
    }
    .error.visible { display: block; }
    .info {
      margin-top: 12px; padding: 10px 14px; border-radius: 10px;
      background: rgba(78,205,196,0.08); border: 1px solid rgba(78,205,196,0.25);
      color: #7adfd7; font-size: 0.85rem; display: none;
    }
    .info.visible { display: block; }
    .notice {
      margin-bottom: 18px; padding: 10px 14px; border-radius: 10px;
      background: rgba(255,159,10,0.10); border: 1px solid rgba(255,159,10,0.30);
      color: #ffd479; font-size: 0.85rem; display: none;
    }
    .notice.visible { display: block; }
    .footer { margin-top: 22px; text-align: center; font-size: 0.85rem; color: #666; }
    .footer a { color: #4ecdc4; text-decoration: none; }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
  <a href="/" class="brand">VidShare</a>

  <div class="card">
    <!-- Step 1: enter email -->
    <div class="step active" id="stepEmail">
      <h1>Sign in</h1>
      <p class="sub">Enter your email and we'll send you a 6-digit code. No password needed — new accounts are created automatically.</p>

      <div class="notice" id="sessionNotice">Your session expired — please sign in again.</div>

      <form id="emailForm" autocomplete="on">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <button type="submit" class="submit-btn" id="emailSubmit">Send code</button>
        <div class="error" id="emailError"></div>
      </form>
    </div>

    <!-- Step 2: enter code -->
    <div class="step" id="stepCode">
      <h1>Check your email</h1>
      <p class="sub">We sent a 6-digit code to <strong id="emailEcho"></strong>. It expires in 10 minutes.</p>

      <form id="codeForm" autocomplete="off">
        <label for="code">Sign-in code</label>
        <input id="code" class="code-input" type="text" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6" required pattern="\d{6}">
        <button type="submit" class="submit-btn" id="codeSubmit">Verify &amp; sign in</button>
        <div class="error" id="codeError"></div>
        <div class="info" id="codeInfo"></div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 8px;">
          <button type="button" class="link-btn" id="changeEmailBtn">← Use a different email</button>
          <button type="button" class="link-btn" id="resendBtn">Resend code</button>
        </div>
      </form>
    </div>

    <div class="footer">
      <a href="/">← Back to home</a>
    </div>
  </div>

  <script>
    const stepEmail = document.getElementById('stepEmail');
    const stepCode  = document.getElementById('stepCode');
    const emailForm = document.getElementById('emailForm');
    const codeForm  = document.getElementById('codeForm');
    const emailEl   = document.getElementById('email');
    const codeEl    = document.getElementById('code');
    const emailEcho = document.getElementById('emailEcho');
    const emailErr  = document.getElementById('emailError');
    const codeErr   = document.getElementById('codeError');
    const codeInfo  = document.getElementById('codeInfo');
    const emailBtn  = document.getElementById('emailSubmit');
    const codeBtn   = document.getElementById('codeSubmit');
    const resendBtn = document.getElementById('resendBtn');
    const changeBtn = document.getElementById('changeEmailBtn');

    let currentEmail = '';

    function show(el, msg) { el.textContent = msg; el.classList.add('visible'); }
    function hide(el)      { el.classList.remove('visible'); }

    function goToStep(which) {
      stepEmail.classList.toggle('active', which === 'email');
      stepCode.classList.toggle('active', which === 'code');
      hide(emailErr); hide(codeErr); hide(codeInfo);
      if (which === 'code') setTimeout(() => codeEl.focus(), 50);
      else setTimeout(() => emailEl.focus(), 50);
    }

    // Tolerate both legacy { error: 'msg' } and new { error: { code, message } }.
    function errMsg(data, fallback) {
      if (!data) return fallback;
      if (data.error && typeof data.error === 'object') return data.error.message || fallback;
      if (typeof data.error === 'string') return data.error;
      return fallback;
    }

    async function requestCode(email) {
      const res = await fetch('/api/auth/request-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, data };
    }

    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hide(emailErr);
      const email = emailEl.value.trim().toLowerCase();
      if (!email) return;
      emailBtn.disabled = true;
      const original = emailBtn.textContent;
      emailBtn.textContent = 'Sending…';
      const { ok, data } = await requestCode(email).catch(() => ({ ok: false, data: {} }));
      emailBtn.disabled = false; emailBtn.textContent = original;
      if (!ok) {
        show(emailErr, errMsg(data, 'Could not send code. Please try again.'));
        return;
      }
      currentEmail = email;
      emailEcho.textContent = email;
      codeEl.value = '';
      goToStep('code');
    });

    // Strip non-digits as the user types so paste works cleanly.
    codeEl.addEventListener('input', () => {
      codeEl.value = codeEl.value.replace(/\D/g, '').slice(0, 6);
    });

    codeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hide(codeErr); hide(codeInfo);
      const code = codeEl.value.trim();
      if (!/^\d{6}$/.test(code)) {
        show(codeErr, 'Please enter the 6-digit code from your email.');
        return;
      }
      codeBtn.disabled = true;
      const original = codeBtn.textContent;
      codeBtn.textContent = 'Verifying…';
      try {
        const res = await fetch('/api/auth/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, code })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          show(codeErr, errMsg(data, 'Could not verify code. Please try again.'));
          codeBtn.disabled = false; codeBtn.textContent = original;
          return;
        }

        // Claim any anonymous uploads stashed in this browser within the last 24h.
        try {
          const KEY = 'vs_pending_claims';
          const raw = localStorage.getItem(KEY);
          const list = raw ? JSON.parse(raw) : [];
          const cutoff = Date.now() - 24 * 60 * 60 * 1000;
          const fresh = Array.isArray(list)
            ? list.filter(e => e && typeof e.id === 'string' && typeof e.ts === 'number' && e.ts >= cutoff)
            : [];
          const videoIds = fresh.map(e => e.id);
          if (videoIds.length) {
            await fetch('/api/my-videos/claim', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ videoIds })
            }).catch(() => {});
          }
          localStorage.removeItem(KEY);
        } catch {}

        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || '/account';
      } catch {
        show(codeErr, 'Network error. Please try again.');
        codeBtn.disabled = false; codeBtn.textContent = original;
      }
    });

    resendBtn.addEventListener('click', async () => {
      if (!currentEmail) return;
      hide(codeErr); hide(codeInfo);
      resendBtn.disabled = true;
      const original = resendBtn.textContent;
      resendBtn.textContent = 'Sending…';
      const { ok, data } = await requestCode(currentEmail).catch(() => ({ ok: false, data: {} }));
      resendBtn.textContent = original;
      if (!ok) {
        show(codeErr, errMsg(data, 'Could not resend code.'));
        // Re-enable after a short delay so they can try again.
        setTimeout(() => { resendBtn.disabled = false; }, 2000);
        return;
      }
      show(codeInfo, 'A new code is on its way.');
      // Soft-cooldown: prevent rapid re-clicks.
      setTimeout(() => { resendBtn.disabled = false; }, 15000);
    });

    changeBtn.addEventListener('click', () => {
      currentEmail = '';
      goToStep('email');
    });

    // Show a friendly notice when the user was bounced here by an expired session.
    {
      const params = new URLSearchParams(window.location.search);
      if (params.get('reason') === 'expired') {
        document.getElementById('sessionNotice').classList.add('visible');
      }
    }

    // If already signed in, jump to account (or the original `next` target).
    fetch('/api/auth/me').then(r => {
      if (!r.ok) return;
      const params = new URLSearchParams(window.location.search);
      window.location.replace(params.get('next') || '/account');
    });
  </script>
</body>
</html>
