<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Sign in – VidShare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='1' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M22 18 L46 32 L22 46 Z' fill='url(%23g)'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; min-height: 100vh; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 20px;
    }
    .brand {
      display: inline-block; margin-bottom: 28px;
      font-size: 1.4rem; font-weight: 800; text-decoration: none;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card {
      width: 100%; max-width: 400px; background: #111;
      border: 1px solid #1c1c1e; border-radius: 20px; padding: 32px 28px;
    }
    .tabs { display: flex; gap: 4px; background: #0a0a0a; padding: 4px; border-radius: 12px; margin-bottom: 22px; }
    .tab {
      flex: 1; padding: 10px; text-align: center; font-size: 0.9rem; font-weight: 600;
      background: transparent; border: none; color: #888; border-radius: 9px;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .tab.active { background: #1c1c1e; color: #fff; }
    h1 { font-size: 1.3rem; margin-bottom: 6px; }
    .sub { font-size: 0.9rem; color: #888; margin-bottom: 22px; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%; padding: 13px 14px; margin-bottom: 14px;
      background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 10px;
      color: #fff; font-size: 0.95rem; font-family: inherit; outline: none;
    }
    input:focus { border-color: #4ecdc4; }
    .submit-btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: filter 0.2s, transform 0.2s;
    }
    .submit-btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      margin-top: 12px; padding: 10px 14px; border-radius: 10px;
      background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3);
      color: #ff8e8e; font-size: 0.85rem; display: none;
    }
    .error.visible { display: block; }
    .footer { margin-top: 22px; text-align: center; font-size: 0.85rem; color: #666; }
    .footer a { color: #4ecdc4; text-decoration: none; }
  </style>
</head>
<body>
  <a href="/" class="brand">VidShare</a>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-mode="login">Sign in</button>
      <button class="tab" data-mode="signup">Create account</button>
    </div>

    <h1 id="formTitle">Welcome back</h1>
    <p class="sub" id="formSub">Sign in to manage your videos.</p>

    <form id="authForm" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="8">

      <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
      <div class="error" id="errorBox"></div>
    </form>

    <div class="footer">
      <a href="/">← Back to home</a>
    </div>
  </div>

  <script>
    const tabs       = document.querySelectorAll('.tab');
    const formTitle  = document.getElementById('formTitle');
    const formSub    = document.getElementById('formSub');
    const submitBtn  = document.getElementById('submitBtn');
    const passwordEl = document.getElementById('password');
    const emailEl    = document.getElementById('email');
    const errorBox   = document.getElementById('errorBox');
    const form       = document.getElementById('authForm');

    // Default to whichever tab the URL requested (e.g. /login?tab=signup),
    // otherwise sign-in. Anything other than "signup" is treated as login.
    const urlParams = new URLSearchParams(window.location.search);
    let mode = urlParams.get('tab') === 'signup' ? 'signup' : 'login';

    function setMode(next) {
      mode = next;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      if (mode === 'signup') {
        formTitle.textContent = 'Create your account';
        formSub.textContent   = 'Free — keep your shareable links organized.';
        submitBtn.textContent = 'Create account';
        passwordEl.autocomplete = 'new-password';
      } else {
        formTitle.textContent = 'Welcome back';
        formSub.textContent   = 'Sign in to manage your videos.';
        submitBtn.textContent = 'Sign in';
        passwordEl.autocomplete = 'current-password';
      }
      hideError();
    }
    tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));

    // Apply the URL-derived initial tab (no-op if it's the default 'login').
    if (mode === 'signup') setMode('signup');

    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('visible'); }
    function hideError()    { errorBox.classList.remove('visible'); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      if (!email || !password) return;
      if (mode === 'signup' && password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }
      submitBtn.disabled = true;
      const original = submitBtn.textContent;
      submitBtn.textContent = mode === 'signup' ? 'Creating…' : 'Signing in…';
      try {
        const res = await fetch(`/api/auth/${mode === 'signup' ? 'signup' : 'login'}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data.error || 'Something went wrong. Try again.');
          submitBtn.disabled = false; submitBtn.textContent = original;
          return;
        }

        // Claim any anonymous uploads stashed in this browser within the last 24h.
        try {
          const KEY = 'vs_pending_claims';
          const raw = localStorage.getItem(KEY);
          const list = raw ? JSON.parse(raw) : [];
          const cutoff = Date.now() - 24 * 60 * 60 * 1000;
          const fresh = Array.isArray(list)
            ? list.filter(e => e && typeof e.id === 'string' && typeof e.ts === 'number' && e.ts >= cutoff)
            : [];
          const videoIds = fresh.map(e => e.id);
          if (videoIds.length) {
            await fetch('/api/my-videos/claim', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ videoIds })
            }).catch(() => {});
          }
          localStorage.removeItem(KEY);
        } catch {}

        // Honor ?next=... if provided, otherwise go to account.
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || '/account';
      } catch {
        showError('Network error. Please try again.');
        submitBtn.disabled = false; submitBtn.textContent = original;
      }
    });

    // If already signed in, jump to account.
    fetch('/api/auth/me').then(r => { if (r.ok) window.location.replace('/account'); });
  </script>
</body>
</html>
