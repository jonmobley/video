# Netlify Configuration for VidShare Video Management System
# This file configures build settings, redirects, and security headers

# Build configuration
[build]
  publish = "."                      # Serve files from root directory
  functions = "netlify/functions"    # Location of serverless functions

# Development server configuration
[dev]
  port = 5000

# URL redirects for cleaner URLs
# Sensitive source/config files are published with the static site; force 404
# so they cannot be downloaded from the CDN even though they exist on disk.
[[redirects]]
  from = "/server.js"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/env.example"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/playwright.config.js"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200                       # Rewrite (URL stays as /admin)

[[redirects]]
  from = "/oz"
  to = "/oz.html"
  status = 200                       # Rewrite (URL stays as /oz)

[[redirects]]
  from = "/disc"
  to = "/disc.html"
  status = 200

[[redirects]]
  from = "/vertical"
  to = "/vertical.html"
  status = 200

[[redirects]]
  from = "/seussical"
  to = "/seussical.html"
  status = 200

[[redirects]]
  from = "/dropbox"
  to = "/dropbox.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200

[[redirects]]
from = "/show/*"
to = "/oz.html"
status = 200                       # Shared template reads slug from pathname

[[redirects]]
  from = "/upload"
  to = "/upload.html"
  status = 200

[[redirects]]
  from = "/watch"
  to = "/watch.html"
  status = 200

# Thumbnail endpoints — match the Express server routes so the Netlify
# deployment serves stored video frames at the same URLs.
[[redirects]]
  from = "/api/upload-chunk"
  to = "/.netlify/functions/upload-chunk"
  status = 200

[[redirects]]
  from = "/api/finalize-video"
  to = "/.netlify/functions/finalize-video"
  status = 200

[[redirects]]
  from = "/api/csp-report"
  to = "/.netlify/functions/csp-report"
  status = 200

[[redirects]]
  from = "/api/upload-thumbnail"
  to = "/.netlify/functions/upload-thumbnail"
  status = 200

[[redirects]]
  from = "/api/video-thumbnail/*"
  to = "/.netlify/functions/get-video-thumbnail/:splat"
  status = 200

[[redirects]]
  from = "/api/upload-link-thumbnail"
  to = "/.netlify/functions/upload-link-thumbnail"
  status = 200

[[redirects]]
  from = "/api/link-thumbnail/*"
  to = "/.netlify/functions/get-link-thumbnail/:splat"
  status = 200

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Reporting-Endpoints = "csp-endpoint=\"/api/csp-report\""
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://fast.wistia.com https://fast.wistia.net https://www.youtube.com https://player.vimeo.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data: https://fast.wistia.com https://fast.wistia.net; connect-src 'self' https://*.supabase.co https://*.wistia.com https://*.wistia.net https://embedwistia-a.akamaihd.net https://vimeo.com https://api.qrserver.com https://www.dropbox.com https://*.dropboxusercontent.com https://*.sentry.io; frame-src https://player.vimeo.com https://www.youtube.com https://www.youtube-nocookie.com https://www.dailymotion.com https://geo.dailymotion.com https://www.loom.com https://fast.wistia.com https://fast.wistia.net; media-src 'self' blob: https://*.wistia.com https://*.wistia.net https://embedwistia-a.akamaihd.net https://www.dropbox.com https://*.dropboxusercontent.com; worker-src 'self' blob:; frame-ancestors 'none'; report-to csp-endpoint; report-uri /api/csp-report"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Scheduled function: clean up expired rate-limit entries every 6 hours
[functions."cleanup-rate-limits"]
  schedule = "0 */6 * * *"