# Netlify Configuration for VidShare Video Management System
# This file configures build settings, redirects, and security headers

# Build configuration
[build]
  publish = "."                      # Serve files from root directory
  functions = "netlify/functions"    # Location of serverless functions

# Development server configuration
[dev]
  port = 5000

# URL redirects for cleaner URLs
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200                       # Rewrite (URL stays as /admin)

[[redirects]]
  from = "/oz"
  to = "/oz.html"
  status = 200                       # Rewrite (URL stays as /oz)

[[redirects]]
  from = "/upload"
  to = "/upload.html"
  status = 200

[[redirects]]
  from = "/watch"
  to = "/watch.html"
  status = 200

# Thumbnail endpoints — match the Express server routes so the Netlify
# deployment serves stored video frames at the same URLs.
[[redirects]]
  from = "/api/csp-report"
  to = "/.netlify/functions/csp-report"
  status = 200

[[redirects]]
  from = "/api/upload-thumbnail"
  to = "/.netlify/functions/upload-thumbnail"
  status = 200

[[redirects]]
  from = "/api/video-thumbnail/*"
  to = "/.netlify/functions/get-video-thumbnail/:splat"
  status = 200

[[redirects]]
  from = "/api/upload-link-thumbnail"
  to = "/.netlify/functions/upload-link-thumbnail"
  status = 200

[[redirects]]
  from = "/api/link-thumbnail/*"
  to = "/.netlify/functions/get-link-thumbnail/:splat"
  status = 200

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fast.wistia.com https://fast.wistia.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data: https://fast.wistia.com https://fast.wistia.net; connect-src 'self' https://*.supabase.co https://*.wistia.com https://*.wistia.net https://embedwistia-a.akamaihd.net https://vimeo.com https://api.qrserver.com; frame-src https://player.vimeo.com https://www.youtube.com https://www.youtube-nocookie.com https://www.dailymotion.com https://geo.dailymotion.com https://www.loom.com https://fast.wistia.com https://fast.wistia.net; media-src 'self' blob: https://*.wistia.com https://*.wistia.net https://embedwistia-a.akamaihd.net; worker-src 'self' blob:; frame-ancestors 'none'; report-uri /api/csp-report"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Scheduled function: clean up expired rate-limit entries every 6 hours
[functions."cleanup-rate-limits"]
  schedule = "0 */6 * * *"