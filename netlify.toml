# Netlify Configuration for VidShare Video Management System
# This file configures build settings, redirects, and security headers

# Build configuration
[build]
  publish = "."                      # Serve files from root directory
  functions = "netlify/functions"    # Location of serverless functions

# Development server configuration
[dev]
  port = 5000

# URL redirects for cleaner URLs
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200                       # Rewrite (URL stays as /admin)

[[redirects]]
  from = "/oz"
  to = "/oz.html"
  status = 200                       # Rewrite (URL stays as /oz)

[[redirects]]
  from = "/upload"
  to = "/upload.html"
  status = 200

[[redirects]]
  from = "/watch"
  to = "/watch.html"
  status = 200

# Thumbnail endpoints — match the Express server routes so the Netlify
# deployment serves stored video frames at the same URLs.
[[redirects]]
  from = "/api/upload-thumbnail"
  to = "/.netlify/functions/upload-thumbnail"
  status = 200

[[redirects]]
  from = "/api/video-thumbnail/*"
  to = "/.netlify/functions/get-video-thumbnail/:splat"
  status = 200

[[redirects]]
  from = "/api/upload-link-thumbnail"
  to = "/.netlify/functions/upload-link-thumbnail"
  status = 200

[[redirects]]
  from = "/api/link-thumbnail/*"
  to = "/.netlify/functions/get-link-thumbnail/:splat"
  status = 200

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"                              # Prevent clickjacking
    X-XSS-Protection = "1; mode=block"                    # Enable XSS filter
    X-Content-Type-Options = "nosniff"                    # Prevent MIME sniffing
    Referrer-Policy = "strict-origin-when-cross-origin"   # Control referrer info

# CORS headers for API functions
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"                     # Allow all origins (restrict in production)
    Access-Control-Allow-Headers = "Content-Type"         # Allow Content-Type header
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"   # Allowed HTTP methods