<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – VidShare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='1' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M22 18 L46 32 L22 46 Z' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles/common.css">
  <link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <div class="top-bar">
    <a href="/" class="logo">VidShare</a>
    <button class="logout-btn hidden" id="logoutBtn">Sign out</button>
  </div>

  <!-- Login -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-icon">🔐</div>
      <div class="login-title">Admin</div>
      <div class="login-sub">Enter your admin token to manage uploaded videos.</div>
      <div class="login-notice" id="loginNotice">Your session expired. Please sign in again.</div>
      <input class="token-input" id="tokenInput" type="password" placeholder="Admin token" aria-label="Admin token">
      <button class="login-btn" id="loginBtn">Sign In</button>
      <div class="login-error" id="loginError" role="alert" aria-live="assertive">Invalid token. Please try again.</div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="container">
      <div class="stats-row" id="statsRow"></div>

      <div class="tab-bar" role="tablist">
        <button class="tab-btn active" role="tab" aria-selected="true" aria-controls="videosPanel" data-tab="videos">Videos</button>
        <button class="tab-btn" role="tab" aria-selected="false" aria-controls="usersPanel" data-tab="users">Users</button>
      </div>

      <div id="videosPanel" class="tab-panel active" role="tabpanel">
        <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
        <div class="filter-bar hidden" id="videoFilterBar" aria-busy="false">
          <input class="search-input" id="videoSearchInput" type="text" placeholder="Search by title…" aria-label="Search videos by title">
          <select class="tier-filter" id="videoStatusFilter" aria-label="Filter by status">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="expired">Expired</option>
            <option value="password">Password-protected</option>
          </select>
          <select class="tier-filter" id="videoPlatformFilter" aria-label="Filter by source">
            <option value="all">All sources</option>
            <option value="upload">Upload</option>
            <option value="youtube">YouTube</option>
            <option value="vimeo">Vimeo</option>
          </select>
          <button class="clear-filters-btn" id="clearVideoFilters" type="button" aria-label="Clear all filters">
            <span class="filter-count" id="videoFilterCount">0</span> Clear filters
          </button>
        </div>
        <div id="videoFilterStatus" class="sr-only" aria-live="polite" role="status"></div>
        <div class="user-count hidden" id="videoCount"></div>
        <div class="video-list" id="videoList"></div>
        <div class="pagination" id="videoPagination"></div>
      </div>

      <div id="usersPanel" class="tab-panel" role="tabpanel">
        <button class="refresh-btn" id="refreshUsersBtn">↻ Refresh</button>
        <div class="filter-bar hidden" id="userFilterBar" aria-busy="false">
          <input class="search-input" id="userSearchInput" type="text" placeholder="Search by email…" aria-label="Search users by email">
          <select class="tier-filter" id="userTierFilter" aria-label="Filter by tier">
            <option value="all">All tiers</option>
            <option value="paid">Paid only</option>
            <option value="free">Free only</option>
          </select>
        </div>
        <div id="userFilterStatus" class="sr-only" aria-live="polite" role="status"></div>
        <div class="user-count hidden" id="userCount"></div>
        <div class="video-list" id="userList"></div>
        <div class="pagination" id="userPagination"></div>
      </div>
    </div>
  </div>

  <script src="/js/shared-platform-config.js"></script>
  <script src="/js/admin-app.js"></script>
</body>
</html>
