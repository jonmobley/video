<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>My Videos – VidShare</title>
  <link rel="stylesheet" href="/styles/upload.css">
  <link rel="stylesheet" href="/styles/common.css">
  <link rel="stylesheet" href="/styles/account.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='1' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M22 18 L46 32 L22 46 Z' fill='url(%23g)'/%3E%3C/svg%3E">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-left">
        <a href="/" class="logo">VidShare</a>
        <a href="/account" class="nav-link">My videos</a>
      </div>
      <div class="nav-left">
        <a href="/upload" class="upload-cta" id="navUploadBtn">+ Upload</a>
        <button class="logout-btn" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </nav>

  <main>
    <div class="header-row">
      <h1>My videos</h1>
      <div class="email-pill" id="emailPill"></div>
    </div>
    <div class="header-sub" id="headerSub">Loading your uploads…</div>

    <div id="content"><div class="spinner"></div></div>
  </main>

  <div class="toast" id="toast"></div>

  <div class="edit-overlay" id="editOverlay" role="dialog" aria-modal="true" aria-labelledby="editDialogTitle" aria-hidden="true">
    <div class="edit-dialog">
      <div class="edit-header">
        <div class="edit-title" id="editDialogTitle">Edit video</div>
        <button class="edit-close" id="editClose" aria-label="Close">&times;</button>
      </div>
      <div class="edit-field">
        <label for="editTitleInput">Title</label>
        <input type="text" id="editTitleInput" maxlength="120" autocomplete="off">
      </div>
      <div class="edit-field">
        <label for="editExpirySelect">Expiration</label>
        <select id="editExpirySelect">
          <option value="keep">Keep current</option>
          <option value="1">1 day from now</option>
          <option value="7">7 days from now</option>
          <option value="30">30 days from now</option>
          <option value="never">Never</option>
        </select>
        <div class="field-hint" id="editExpiryHint"></div>
      </div>
      <div class="edit-field">
        <label for="editPasswordInput">Password</label>
        <input type="password" id="editPasswordInput" maxlength="200" autocomplete="off" placeholder="Enter new password">
        <div class="field-hint" id="editPasswordHint"></div>
        <div class="edit-remove-pw hidden" id="editRemovePwRow">
          <input type="checkbox" id="editRemovePw">
          <label for="editRemovePw">Remove password protection</label>
        </div>
      </div>
      <div class="edit-error" id="editError"></div>
      <div class="edit-actions">
        <button class="edit-modal-btn" id="editCancel">Cancel</button>
        <button class="edit-modal-btn primary" id="editSave">Save changes</button>
      </div>
    </div>
  </div>

  <div class="tp-overlay" id="tpOverlay" role="dialog" aria-modal="true" aria-labelledby="tpTitle" aria-hidden="true">
    <div class="tp-dialog">
      <div class="tp-header">
        <div class="tp-title" id="tpTitle">Change thumbnail</div>
        <button class="tp-close" id="tpClose" aria-label="Close">&times;</button>
      </div>
      <div class="tp-sub" id="tpSub">Pick a frame from your video or upload your own image.</div>

      <div class="tp-section-title" id="tpFramesTitle">Pick a frame</div>
      <div class="tp-grid" id="tpGrid" role="listbox" aria-label="Thumbnail frame options"></div>

      <div class="tp-section-title">Upload your own</div>
      <div class="tp-upload-row">
        <div class="tp-upload-preview" id="tpUploadPreview">No file</div>
        <button type="button" class="tp-file-btn" id="tpFileBtn">Choose image…</button>
        <div class="tp-file-hint">JPEG, PNG, or WebP. Max 500&nbsp;KB after compression.</div>
        <input type="file" id="tpFileInput" accept="image/jpeg,image/png,image/webp" class="hidden">
      </div>

      <div class="tp-error" id="tpError"></div>

      <div class="tp-actions">
        <button class="tp-btn" id="tpCancel">Cancel</button>
        <button class="tp-btn primary" id="tpSave" disabled>Save thumbnail</button>
      </div>
    </div>
  </div>

  <script src="/js/shared-platform-config.js"></script>
  <script src="/js/account-app.js"></script>
  <script src="/js/link-parser.js"></script>
  <script src="/lib/qrcode-generator.js"></script>
  <script src="/js/thumbnail-capture.js"></script>
  <script src="/js/upload-widget.js"></script>
  <script src="/js/upload-modal.js"></script>
</body>
</html>
