<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Upload Video – VidShare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='1' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M22 18 L46 32 L22 46 Z' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles/common.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      background: #0a0a0a;
    }

    .header { text-align: center; margin-bottom: 32px; }
    .logo {
      font-size: 2rem; font-weight: 700;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; text-decoration: none; display: inline-block;
    }
    .page-title { font-size: 1rem; color: #888; margin-top: 6px; }

    .card {
      background: #1c1c1e; border-radius: 20px;
      padding: 28px 22px; width: 100%; max-width: 480px;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #3A3A3C; border-radius: 16px;
      padding: 40px 20px; text-align: center; cursor: pointer;
      transition: all 0.2s ease; position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #007AFF; background: rgba(0,122,255,0.06);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-icon { font-size: 2.8rem; margin-bottom: 12px; display: block; }
    .drop-label { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .drop-sub { font-size: 0.85rem; color: #888; }
    .size-limit { font-size: 0.78rem; color: #555; margin-top: 6px; }

    /* File preview */
    .file-preview {
      display: none; align-items: center; gap: 14px;
      margin-top: 18px; padding: 14px; background: #2c2c2e; border-radius: 12px;
    }
    .file-preview.visible { display: flex; }
    .file-icon { font-size: 1.8rem; flex-shrink: 0; }
    .file-info { flex: 1; overflow: hidden; }
    .file-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size-txt { font-size: 0.78rem; color: #888; margin-top: 2px; }
    .file-remove { background: none; border: none; color: #666; font-size: 1.1rem; cursor: pointer; padding: 4px; }

    /* Form fields */
    .fields { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }

    .field label { display: block; font-size: 0.82rem; font-weight: 600; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field input, .field select {
      width: 100%; padding: 12px 14px; background: #2c2c2e;
      border: 1px solid #38383A; border-radius: 10px; color: #fff;
      font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    .field input:focus, .field select:focus { border-color: #007AFF; }
    .field input::placeholder { color: #555; }
    .field select option { background: #1c1c1e; }

    .fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* Upload button — gradient, on-brand. Higher specificity (button.btn.upload-btn)
       defeats common.css's .btn { background: #007AFF } default. */
    button.btn.upload-btn,
    button.btn.upload-btn:hover {
      margin-top: 20px; width: 100%; padding: 15px;
      font-size: 1.05rem; border-radius: 14px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      color: #fff; border: none; font-weight: 600;
      box-shadow: 0 8px 24px rgba(78,205,196,0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    button.btn.upload-btn { display: none; }
    button.btn.upload-btn.visible { display: flex; }
    button.btn.upload-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(78,205,196,0.32);
    }
    button.btn.upload-btn:active { transform: translateY(0); filter: brightness(0.96); }

    /* Copy button — gradient for consistency, green on copied */
    button.btn.copy-btn,
    button.btn.copy-btn:hover {
      width: 100%; padding: 14px; font-size: 0.95rem; border-radius: 14px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      color: #fff; border: none; font-weight: 600;
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    button.btn.copy-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button.btn.copy-btn.copied,
    button.btn.copy-btn.copied:hover { background: #30d158; filter: none; transform: none; }

    /* Icon styling for inline SVGs replacing emoji */
    .icon-svg { display: block; }
    .drop-icon-wrap {
      width: 56px; height: 56px; margin: 0 auto 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,107,107,0.15), rgba(78,205,196,0.15));
      display: flex; align-items: center; justify-content: center;
    }
    .drop-icon-wrap svg { width: 28px; height: 28px; }
    .file-icon-wrap {
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(255,107,107,0.15), rgba(78,205,196,0.15));
      display: flex; align-items: center; justify-content: center;
    }
    .file-icon-wrap svg { width: 18px; height: 18px; }
    .success-icon-wrap {
      width: 56px; height: 56px; margin: 0 auto 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
      display: flex; align-items: center; justify-content: center;
    }
    .success-icon-wrap svg { width: 30px; height: 30px; }

    /* Progress */
    .progress-area { display: none; margin-top: 20px; }
    .progress-area.visible { display: block; }
    .progress-label { font-size: 0.85rem; color: #aaa; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .progress-bar-track { background: #2c2c2e; border-radius: 999px; height: 8px; overflow: hidden; }
    .progress-bar-fill { background: linear-gradient(90deg, #007AFF, #4ecdc4); height: 100%; width: 0%; border-radius: 999px; transition: width 0.3s ease; }

    /* Success */
    .success-area { display: none; margin-top: 20px; text-align: center; }
    .success-area.visible { display: block; }
    .success-icon { font-size: 2.8rem; margin-bottom: 10px; }
    .success-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
    .success-sub { font-size: 0.88rem; color: #888; margin-bottom: 20px; }

    .share-link-box {
      background: #2c2c2e; border-radius: 10px; padding: 12px 14px;
      margin-bottom: 12px; word-break: break-all; font-size: 0.82rem;
      color: #aaa; text-align: left; border: 1px solid #3A3A3C;
    }

    .qr-wrap { margin: 18px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .qr-wrap img { border-radius: 12px; border: 3px solid #2c2c2e; }
    .qr-label { font-size: 0.78rem; color: #555; }

    .meta-row { display: flex; justify-content: center; gap: 20px; margin-bottom: 16px; }
    .meta-badge {
      font-size: 0.78rem; color: #888; background: #2c2c2e;
      padding: 5px 10px; border-radius: 20px;
    }

    .watch-link-btn {
      display: block; margin-top: 10px; text-align: center;
      color: #007AFF; font-size: 0.9rem; text-decoration: none; padding: 10px;
    }
    .another-btn {
      margin-top: 8px; width: 100%; padding: 13px; font-size: 0.9rem;
      border-radius: 14px; background: #2c2c2e; color: #fff;
    }
    .another-btn:hover { background: #3A3A3C; }

    /* Error */
    .error-msg {
      display: none; margin-top: 14px; padding: 12px 14px;
      background: rgba(255,59,48,0.12); border: 1px solid rgba(255,59,48,0.3);
      border-radius: 10px; color: #ff6b6b; font-size: 0.88rem; text-align: center;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <a href="/" class="logo">VidShare</a>
    <div class="page-title">Upload a video</div>
  </div>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="video/*">
      <span class="drop-icon-wrap">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="url(#vsGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <defs><linearGradient id="vsGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#4ecdc4"/></linearGradient></defs>
          <path d="M12 16V4M12 4l-5 5M12 4l5 5"/>
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
      </span>
      <div class="drop-label">Tap to choose a video</div>
      <div class="drop-sub">Any format · Vertical or horizontal</div>
      <div class="size-limit">Max 1 GB</div>
    </div>

    <div class="file-preview" id="filePreview">
      <span class="file-icon-wrap">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#4ecdc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="6" width="14" height="12" rx="2"/>
          <path d="M22 8l-6 4 6 4V8z"/>
        </svg>
      </span>
      <div class="file-info">
        <div class="file-name" id="fileName"></div>
        <div class="file-size-txt" id="fileSizeTxt"></div>
      </div>
      <button class="file-remove" id="fileRemove">✕</button>
    </div>

    <div class="fields" id="fieldsArea" style="display:none;">
      <div class="field">
        <label>Title</label>
        <input type="text" id="titleInput" placeholder="e.g. Practice run – June 3" maxlength="120" required>
      </div>
      <div class="fields-row">
        <div class="field">
          <label>Link expires</label>
          <select id="expirySelect">
            <option value="1">1 day</option>
            <option value="7" selected>7 days</option>
            <option value="30">30 days</option>
            <option value="never">Never</option>
          </select>
        </div>
        <div class="field">
          <label>Password (optional)</label>
          <input type="password" id="passwordInput" placeholder="Leave blank = public" maxlength="64">
        </div>
      </div>
    </div>

    <button class="btn upload-btn" id="uploadBtn">Upload &amp; Get Link</button>

    <div class="progress-area" id="progressArea">
      <div class="progress-label">
        <span id="progressText">Uploading…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="success-area" id="successArea">
      <div class="success-icon-wrap">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="5 12 10 17 19 8"/>
        </svg>
      </div>
      <div class="success-title">Ready to share!</div>
      <div class="success-sub" id="successSub">Copy the link and send it to anyone.</div>

      <div class="meta-row" id="metaRow"></div>

      <div class="share-link-box" id="shareLink"></div>
      <button class="btn copy-btn" id="copyBtn">Copy Link</button>

      <div class="qr-wrap" id="qrWrap">
        <img id="qrImg" src="" alt="QR Code" width="160" height="160">
        <div class="qr-label">Scan to watch</div>
      </div>

      <a class="watch-link-btn" id="watchLinkBtn" target="_blank">Watch it now ↗</a>
      <button class="btn another-btn" id="anotherBtn">Upload another video</button>
    </div>
  </div>

  <script>
    const CHUNK_SIZE = 3 * 1024 * 1024;
    const MAX_SIZE = 1024 * 1024 * 1024;

    const els = id => document.getElementById(id);
    const dropZone    = els('dropZone');
    const fileInput   = els('fileInput');
    const filePreview = els('filePreview');
    const fileName    = els('fileName');
    const fileSizeTxt = els('fileSizeTxt');
    const fileRemove  = els('fileRemove');
    const fieldsArea  = els('fieldsArea');
    const uploadBtn   = els('uploadBtn');
    const progressArea = els('progressArea');
    const progressText = els('progressText');
    const progressPct  = els('progressPct');
    const progressFill = els('progressFill');
    const errorMsg    = els('errorMsg');
    const successArea = els('successArea');
    const shareLink   = els('shareLink');
    const copyBtn     = els('copyBtn');
    const watchLinkBtn = els('watchLinkBtn');
    const anotherBtn  = els('anotherBtn');
    const qrImg       = els('qrImg');
    const metaRow     = els('metaRow');
    const successSub  = els('successSub');

    let selectedFile = null;

    // Chunked base64 encode. The naive `String.fromCharCode(...bytes)` spreads
    // every byte as a function argument, which overflows the JS call stack on
    // any chunk larger than ~100 KB. We process in 32 KB windows instead.
    function arrayBufferToBase64(ab) {
      const bytes = new Uint8Array(ab);
      const WINDOW = 0x8000; // 32 KB
      let binary = '';
      for (let i = 0; i < bytes.length; i += WINDOW) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + WINDOW));
      }
      return btoa(binary);
    }

    function formatBytes(b) {
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1024 * 1024 * 1024) return (b / (1024 * 1024)).toFixed(1) + ' MB';
      return (b / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function genId() {
      const arr = new Uint8Array(12);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    function getExt(file) {
      const parts = file.name.split('.');
      if (parts.length > 1) return parts.pop().toLowerCase();
      const m = file.type;
      if (m === 'video/mp4') return 'mp4';
      if (m === 'video/quicktime') return 'mov';
      if (m === 'video/webm') return 'webm';
      return 'mp4';
    }

    // Derive a friendly title from the filename:
    //   "my-clip_take_2.MP4" → "my clip take 2"
    // - Strip the final extension (only the last `.`)
    // - Replace `-` and `_` runs with spaces
    // - Collapse extra whitespace
    function deriveTitleFromFilename(name) {
      const lastDot = name.lastIndexOf('.');
      const base = lastDot > 0 ? name.slice(0, lastDot) : name;
      return base.replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function setFile(file) {
      if (file.size > MAX_SIZE) {
        showError(`File is too large (${formatBytes(file.size)}). Maximum size is 1 GB.`);
        return;
      }
      selectedFile = file;
      fileName.textContent = file.name;
      fileSizeTxt.textContent = formatBytes(file.size);
      filePreview.classList.add('visible');
      fieldsArea.style.display = 'flex';
      uploadBtn.classList.add('visible');
      dropZone.style.display = 'none';

      // Auto-fill the title from the filename. User can edit it freely.
      // Only fill if the title input is empty so we don't clobber edits when
      // they pick a different file after typing.
      const titleEl = els('titleInput');
      if (!titleEl.value.trim()) {
        titleEl.value = deriveTitleFromFilename(file.name);
      }
      updateUploadBtnState();
      hideError();
    }

    function updateUploadBtnState() {
      const hasFile = !!selectedFile;
      const hasTitle = els('titleInput').value.trim().length > 0;
      uploadBtn.disabled = !(hasFile && hasTitle);
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = '';
      filePreview.classList.remove('visible');
      fieldsArea.style.display = 'none';
      uploadBtn.classList.remove('visible');
      dropZone.style.display = '';
      hideError();
    }

    function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('visible'); }
    function hideError() { errorMsg.classList.remove('visible'); }
    function setProgress(pct, label) {
      progressFill.style.width = pct + '%';
      progressPct.textContent = pct + '%';
      progressText.textContent = label || 'Uploading…';
    }

    fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
    fileRemove.addEventListener('click', clearFile);
    document.addEventListener('input', e => { if (e.target.id === 'titleInput') updateUploadBtnState(); });

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f && f.type.startsWith('video/')) setFile(f);
      else showError('Please drop a video file.');
    });

    uploadBtn.addEventListener('click', startUpload);

    async function startUpload() {
      if (!selectedFile) return;
      const title = els('titleInput').value.trim();
      if (!title) {
        showError('Please add a title for your video.');
        els('titleInput').focus();
        return;
      }
      const file = selectedFile;
      const ext = getExt(file);
      const videoId = genId() + '.' + ext;
      const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
      const expiryDays = els('expirySelect').value;
      const password = els('passwordInput').value;

      uploadBtn.classList.remove('visible');
      filePreview.classList.remove('visible');
      fieldsArea.style.display = 'none';
      progressArea.classList.add('visible');
      hideError();
      setProgress(0, 'Preparing…');

      try {
        for (let i = 0; i < totalChunks; i++) {
          const start = i * CHUNK_SIZE;
          const slice = file.slice(start, Math.min(start + CHUNK_SIZE, file.size));
          const ab = await slice.arrayBuffer();
          const base64 = arrayBufferToBase64(ab);

          setProgress(Math.round((i / totalChunks) * 85), `Uploading… (${i + 1} of ${totalChunks})`);

          const res = await fetch('/api/upload-chunk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ videoId, chunkIndex: i, totalChunks, data: base64, contentType: file.type || 'video/mp4' })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || `Chunk ${i} failed`);
          }
        }

        setProgress(92, 'Finalizing…');

        const finalRes = await fetch('/api/finalize-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ videoId, totalChunks, contentType: file.type || 'video/mp4', title, expiryDays, password })
        });
        if (!finalRes.ok) {
          const err = await finalRes.json().catch(() => ({}));
          throw new Error(err.error || 'Finalize failed');
        }

        setProgress(100, 'Done!');

        const watchUrl = window.location.origin + '/watch?id=' + encodeURIComponent(videoId);

        setTimeout(() => {
          progressArea.classList.remove('visible');
          successArea.classList.add('visible');
          shareLink.textContent = watchUrl;
          watchLinkBtn.href = watchUrl;

          // Meta badges
          metaRow.innerHTML = '';
          if (title) {
            const b = document.createElement('span');
            b.className = 'meta-badge'; b.textContent = title;
            metaRow.appendChild(b);
          }
          const expBadge = document.createElement('span');
          expBadge.className = 'meta-badge';
          expBadge.textContent = expiryDays === 'never' ? 'No expiry' : `Expires in ${expiryDays} day${expiryDays === '1' ? '' : 's'}`;
          metaRow.appendChild(expBadge);
          if (password) {
            const pb = document.createElement('span');
            pb.className = 'meta-badge'; pb.textContent = 'Password protected';
            metaRow.appendChild(pb);
          }

          // Success sub message
          successSub.textContent = password
            ? 'Share the link — recipients will need the password to watch.'
            : 'Copy the link and send it to anyone.';

          // QR code
          qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&color=ffffff&bgcolor=1c1c1e&data=' + encodeURIComponent(watchUrl);

          // Auto-copy
          navigator.clipboard.writeText(watchUrl).then(() => {
            copyBtn.textContent = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(() => { copyBtn.textContent = 'Copy Link'; copyBtn.classList.remove('copied'); }, 3000);
          }).catch(() => {});
        }, 400);

      } catch (err) {
        progressArea.classList.remove('visible');
        uploadBtn.classList.add('visible');
        filePreview.classList.add('visible');
        fieldsArea.style.display = 'flex';
        showError('Upload failed: ' + err.message);
      }
    }

    copyBtn.addEventListener('click', async () => {
      const url = shareLink.textContent;
      try { await navigator.clipboard.writeText(url); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      copyBtn.textContent = 'Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = 'Copy Link'; copyBtn.classList.remove('copied'); }, 2500);
    });

    anotherBtn.addEventListener('click', () => {
      successArea.classList.remove('visible');
      els('titleInput').value = '';
      els('passwordInput').value = '';
      clearFile();
      updateUploadBtnState();
    });
  </script>
</body>
</html>
