<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Upload Video – VidShare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='1' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M22 18 L46 32 L22 46 Z' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles/common.css">
  <link rel="stylesheet" href="/styles/upload.css">
  <style>
    :root {
      --upload-content-width: 480px;
      --upload-content-pad: 20px;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
      background: radial-gradient(ellipse at top, rgba(78,205,196,0.08), transparent 60%),
                  radial-gradient(ellipse at bottom, rgba(255,107,107,0.06), transparent 60%),
                  #0a0a0a;
    }

    .nav {
      border-bottom: 1px solid #1a1a1a;
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      max-width: calc(var(--upload-content-width) + 2 * var(--upload-content-pad));
      margin: 0 auto; padding: 18px var(--upload-content-pad);
    }
    .nav-left { display: flex; align-items: center; gap: 18px; }
    .logo {
      font-size: 1.2rem; font-weight: 800; text-decoration: none;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-link {
      font-size: 0.9rem; color: #aaa; text-decoration: none;
      padding: 8px 14px; border-radius: 10px; transition: all 0.2s;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .logout-btn {
      background: none; border: 1px solid #2c2c2e; color: #aaa;
      padding: 8px 14px; border-radius: 10px; font-size: 0.85rem;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .logout-btn:hover { color: #fff; border-color: #3a3a3c; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px var(--upload-content-pad) 60px;
    }

    .page-title {
      width: 100%;
      max-width: var(--upload-content-width);
      font-size: 1rem; color: #959595; margin-bottom: 32px; text-align: center;
    }

    @media (max-width: 768px) {
      body { padding: 0; }
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 60px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      :root {
        --upload-content-pad: 14px;
      }
      .nav-inner { padding: 12px var(--upload-content-pad); gap: 8px; flex-wrap: wrap; }
      .nav-left { gap: 8px; }
      .nav-link { display: none; }
      .logout-btn { padding: 9px 12px; font-size: 0.82rem; }
      main {
        padding: 22px var(--upload-content-pad) max(40px, env(safe-area-inset-bottom));
      }
      .page-title { font-size: 0.92rem; margin-bottom: 22px; }
    }
  </style>
</head>
<body>
  <div class="spinner" id="authSpinner"></div>

  <nav class="nav" id="pageNav" style="display:none">
    <div class="nav-inner">
      <div class="nav-left">
        <a href="/" class="logo">VidShare</a>
        <a href="/account" class="nav-link">My videos</a>
      </div>
      <div class="nav-left">
        <button class="logout-btn" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </nav>

  <main id="pageMain" style="display:none">
    <div class="page-title">Upload a video</div>
    <div id="uploadRoot"></div>
  </main>

  <script src="/js/link-parser.js"></script>
  <script src="/lib/qrcode-generator.js"></script>
  <script src="/js/thumbnail-capture.js"></script>
  <script src="/js/upload-widget.js"></script>
  <script src="/js/upload-page.js"></script>
</body>
</html>
