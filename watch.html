<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Watch – VidShare</title>
  <link rel="stylesheet" href="/styles/upload.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b6b'/%3E%3Cstop offset='1' stop-color='%234ecdc4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Cpath d='M22 18 L46 32 L22 46 Z' fill='url(%23g)'/%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; min-height: 100vh;
      display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }

    /* ── Stage (video area) ──────────────────────────────────────────────── */
    .stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      min-height: 0;
    }
    .video-wrap {
      width: 100%; max-width: 1100px;
      display: flex; flex-direction: column; align-items: stretch;
    }
    .video-title {
      margin-top: 14px;
      font-size: 1.05rem; font-weight: 600; color: #f2f2f2;
      text-align: left; word-break: break-word;
    }
    @media (max-width: 600px) {
      .video-title { margin-top: 10px; font-size: 0.98rem; }
    }
    video {
      display: block;
      width: 100%; height: auto;
      max-height: calc(100vh - 160px);
      background: #000; border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    /* Embed wrapper preserves a 16:9 box without locking video uploads to it */
    .embed-frame {
      position: relative; width: 100%;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 200px);
      background: #000; border-radius: 12px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .embed-frame iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: 0;
    }
    .gating-note {
      margin-top: 12px; font-size: 0.78rem; color: rgba(255,255,255,0.45);
      text-align: center; max-width: 640px; line-height: 1.5;
    }

    /* The host holds the iframe; sibling fallback overlays on top when shown.
       Keeping host and fallback as siblings means VideoPlatformManager's
       container.innerHTML='' on the host doesn't wipe out the fallback. */
    .embed-host {
      position: absolute; inset: 0;
    }
    .embed-host iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: 0;
    }

    /* Embed unavailable fallback (private / removed / embedding disabled) */
    .embed-fallback {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; text-align: center; padding: 24px;
      background: #0a0a0a;
    }
    .embed-fallback .ef-icon { font-size: 2.2rem; }
    .embed-fallback .ef-title { font-size: 1rem; font-weight: 600; }
    .embed-fallback .ef-sub { font-size: 0.85rem; color: #888; max-width: 360px; }
    .embed-fallback a {
      display: inline-block; padding: 10px 18px; border-radius: 10px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600;
    }

    @media (max-width: 600px) {
      .stage { padding: 12px; }
      video, .embed-frame { border-radius: 8px; }
      video { max-height: calc(100vh - 140px); }
      .embed-frame { max-height: calc(100vh - 180px); }
    }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    .footer {
      flex-shrink: 0; padding: 14px 20px; text-align: center;
      font-size: 0.82rem; color: rgba(255,255,255,0.45);
      border-top: 1px solid #1a1a1a;
    }
    .footer a {
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none; font-weight: 700;
    }
    .footer a:hover { filter: brightness(1.1); }
    .footer-upload-btn {
      background: none; border: 1px solid #2c2c2e; color: #ddd;
      padding: 6px 14px; border-radius: 999px; font-size: 0.82rem;
      font-weight: 600; cursor: pointer; font-family: inherit;
      margin-left: 14px; transition: all 0.2s;
    }
    .footer-upload-btn:hover { background: #1c1c1e; border-color: #3a3a3c; color: #fff; }

    /* ── Loading / error states ──────────────────────────────────────────── */
    .state-overlay {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; text-align: center; padding: 40px 24px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-title { font-size: 1.05rem; font-weight: 600; }
    .state-sub { font-size: 0.88rem; color: #888; max-width: 320px; }
    .upload-link {
      display: inline-block; margin-top: 6px; padding: 10px 18px; border-radius: 10px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600;
    }

    /* ── Password prompt ─────────────────────────────────────────────────── */
    .pw-card {
      background: #111; border: 1px solid #1f1f1f; border-radius: 20px;
      padding: 32px 24px; width: 100%; max-width: 360px; text-align: center;
    }
    .pw-icon { font-size: 2.5rem; margin-bottom: 14px; }
    .pw-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .pw-sub { font-size: 0.88rem; color: #888; margin-bottom: 22px; }
    .pw-input {
      width: 100%; padding: 14px; background: #1c1c1e; border: 1px solid #2c2c2e;
      border-radius: 10px; color: #fff; font-size: 1rem; font-family: inherit;
      outline: none; margin-bottom: 14px; text-align: center; letter-spacing: 0.1em;
    }
    .pw-input:focus { border-color: #4ecdc4; }
    .pw-btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
      color: #fff; font-size: 1rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: filter 0.2s;
    }
    .pw-btn:hover { filter: brightness(1.08); }
    .pw-error { font-size: 0.85rem; color: #ff6b6b; margin-top: 10px; display: none; }
    .pw-error.visible { display: block; }

    /* ── QR share section ────────────────────────────────────────────────── */
    .qr-section { margin-top: 14px; }
    .qr-toggle {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; border: 1px solid #2c2c2e;
      color: #ddd; padding: 8px 14px; border-radius: 999px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .qr-toggle:hover { background: #1c1c1e; border-color: #4ecdc4; color: #fff; }
    .qr-toggle-icon { width: 14px; height: 14px; flex-shrink: 0; }
    .qr-toggle-chevron { width: 12px; height: 12px; transition: transform 0.2s ease; }
    .qr-section.open .qr-toggle-chevron { transform: rotate(180deg); }
    .qr-panel {
      margin-top: 12px; display: flex; flex-direction: column;
      align-items: flex-start; gap: 10px;
    }
    .qr-panel[hidden] { display: none; }
    .qr-panel img {
      background: #1c1c1e; border-radius: 12px; border: 3px solid #2c2c2e;
      width: 160px; height: 160px;
    }
    .qr-download-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #2c2c2e; color: #ddd; border: none;
      padding: 8px 14px; border-radius: 999px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .qr-download-btn:hover { background: #3a3a3c; color: #fff; }
    .qr-download-btn svg { width: 14px; height: 14px; }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 60px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255,255,255,0.15); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); color: #fff;
      padding: 12px 24px; border-radius: 999px; font-size: 0.88rem;
      font-weight: 600; opacity: 0; transition: all 0.3s ease;
      pointer-events: none; white-space: nowrap; z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <main class="stage" id="root"></main>

  <footer class="footer">
    Powered by <a href="/">VidShare</a>
    <button type="button" class="footer-upload-btn" id="footerUploadBtn">+ Upload a video</button>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="/js/link-parser.js"></script>
  <script src="/js/video-platform.js"></script>
  <script>
    const root  = document.getElementById('root');
    const toast = document.getElementById('toast');
    let videoTitle = '';

    // Cached metadata so we don't re-fetch after a successful password verify.
    let videoMeta = null;

    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function showLoading() {
      root.innerHTML = `<div class="state-overlay"><div class="spinner"></div><div class="state-title">Loading…</div></div>`;
    }

    function showError(msg, showUploadLink) {
      root.innerHTML = `
        <div class="state-overlay">
          <div style="font-size:2.5rem">⚠️</div>
          <div class="state-title">Can't play this video</div>
          <div class="state-sub">${msg}</div>
          ${showUploadLink ? '<a href="/upload" class="upload-link">Upload a video</a>' : ''}
        </div>`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function showVideo(videoUrl) {
      const titleHtml = videoTitle
        ? `<div class="video-title">${escapeHtml(videoTitle)}</div>`
        : '';
      root.innerHTML = `
        <div class="video-wrap">
          <video id="videoEl" src="${videoUrl}" controls autoplay playsinline preload="auto"></video>
          ${titleHtml}
          ${renderQrSection()}
        </div>`;
      attachQrHandlers();
    }

    function renderQrSection() {
      return `
        <div class="qr-section" id="qrSection">
          <button type="button" class="qr-toggle" id="qrToggle" aria-expanded="false">
            <svg class="qr-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
              <path d="M14 14h3v3h-3zM20 14h1v1M14 20h3v1M20 17h1v4"/>
            </svg>
            <span id="qrToggleLabel">Show QR code</span>
            <svg class="qr-toggle-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="qr-panel" id="qrPanel" hidden>
            <img id="qrImg" src="" alt="QR code for this video" width="160" height="160">
            <button type="button" class="qr-download-btn" id="qrDownloadBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              <span>Download QR code</span>
            </button>
          </div>
        </div>`;
    }

    function slugifyForFilename(s) {
      return (s || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 60);
    }

    function attachQrHandlers() {
      const section = document.getElementById('qrSection');
      const toggle = document.getElementById('qrToggle');
      const label = document.getElementById('qrToggleLabel');
      const panel = document.getElementById('qrPanel');
      const img = document.getElementById('qrImg');
      const dlBtn = document.getElementById('qrDownloadBtn');
      if (!section || !toggle || !panel || !img || !dlBtn) return;

      const watchUrl = window.location.href;
      const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&color=ffffff&bgcolor=1c1c1e&data=' + encodeURIComponent(watchUrl);

      toggle.addEventListener('click', () => {
        const isOpen = !panel.hidden;
        if (isOpen) {
          panel.hidden = true;
          toggle.setAttribute('aria-expanded', 'false');
          label.textContent = 'Show QR code';
          section.classList.remove('open');
        } else {
          if (!img.src) img.src = qrSrc;
          panel.hidden = false;
          toggle.setAttribute('aria-expanded', 'true');
          label.textContent = 'Hide QR code';
          section.classList.add('open');
        }
      });

      dlBtn.addEventListener('click', async () => {
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('id') || '';
        const baseName = slugifyForFilename(videoTitle) || (videoId ? videoId.split('.')[0] : 'video');
        const filename = `vidshare-qr-${baseName}.png`;
        const src = img.src || qrSrc;
        try {
          const res = await fetch(src, { mode: 'cors' });
          if (!res.ok) throw new Error('Fetch failed');
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch {
          const a = document.createElement('a');
          a.href = src; a.download = filename; a.target = '_blank';
          document.body.appendChild(a); a.click(); a.remove();
        }
      });
    }

    /**
     * Render an embedded YouTube/Vimeo player. Uses VideoPlatformManager so
     * upload, Dropbox, YouTube, and Vimeo all flow through one entry point.
     *
     * Graceful fallback layers, from cheapest to most defensive:
     *  1. The server pre-checks the platform's oEmbed endpoint and sets
     *     `embedAvailable=false` for private / removed / embedding-disabled
     *     videos — render the fallback panel directly without an iframe.
     *  2. If the iframe does mount, VideoPlatformManager attaches the
     *     YouTube IFrame API (onError) and Vimeo Player.js (ready/error)
     *     to detect cases the server check missed (e.g. private to a
     *     specific viewer, or domain-restricted embedding) and triggers
     *     our onError callback below to surface the fallback immediately.
     *  3. A 10s client-side timeout remains as a last-resort safety net
     *     for the rare case where neither signal arrives (network block,
     *     player API fails to load, etc.).
     */
    function showEmbed(meta) {
      const platform = meta.platform;
      const embedId = meta.embedVideoId;
      const originalUrl = (window.LinkParser && window.LinkParser.buildOriginalUrl)
        ? window.LinkParser.buildOriginalUrl(platform, embedId)
        : '';
      const platformLabel = platform === 'youtube' ? 'YouTube' : 'Vimeo';
      const noteText = `Note: this watch page's password and expiration only protect this page. Anyone who already has the original ${platformLabel} URL can still view it there.`;

      const titleHtml = videoTitle
        ? `<div class="video-title">${escapeHtml(videoTitle)}</div>`
        : '';
      root.innerHTML = `
        <div class="video-wrap">
          <div class="embed-frame" id="embedFrame">
            <div class="embed-host" id="embedHost"></div>
            <div class="embed-fallback" id="embedFallback" style="display:none;">
              <div class="ef-icon">⚠️</div>
              <div class="ef-title">This embed isn't available</div>
              <div class="ef-sub">The video may be private, removed, or have embedding disabled by the owner.</div>
              ${originalUrl ? `<a href="${originalUrl}" target="_blank" rel="noopener noreferrer">Open on ${platformLabel} ↗</a>` : ''}
            </div>
          </div>
          ${titleHtml}
          <div class="gating-note">${noteText}</div>
          ${renderQrSection()}
        </div>`;
      attachQrHandlers();

      const host = document.getElementById('embedHost');
      const fallback = document.getElementById('embedFallback');

      // Server-side oEmbed check has already definitively determined that the
      // video can't be embedded — show the fallback immediately and skip the
      // iframe entirely so the viewer doesn't briefly see the platform's own
      // "video unavailable" UI.
      if (meta.embedAvailable === false) {
        fallback.style.display = 'flex';
        return;
      }

      // Safety net for the rare case where oEmbed reported the video as
      // available but the iframe still fails to load for the viewer
      // (network block, DNS issues, etc). showFallback is idempotent.
      let fallbackShown = false;
      const showFallback = () => {
        if (fallbackShown) return;
        fallbackShown = true;
        fallback.style.display = 'flex';
      };
      const loadTimer = setTimeout(showFallback, 10000);

      const mgr = new window.VideoPlatformManager();
      mgr.loadVideo({
        platform,
        embedVideoId: embedId,
        wistiaId: embedId,
        title: meta.title || ''
      }, host,
        () => clearTimeout(loadTimer),
        // Platform reported the video can't be played (private / removed /
        // embedding disabled). Surface the friendly fallback immediately so
        // the viewer sees our "Open on YouTube/Vimeo" link instead of the
        // platform's in-frame error.
        () => { clearTimeout(loadTimer); showFallback(); }
      );
    }

    function showPasswordPrompt(videoId) {
      root.innerHTML = `
        <div class="pw-card">
          <div class="pw-icon">🔒</div>
          <div class="pw-title">Password required</div>
          <div class="pw-sub">This video is password protected.</div>
          <input class="pw-input" id="pwInput" type="password" placeholder="Enter password" autocomplete="off">
          <button class="pw-btn" id="pwSubmit">Watch Video</button>
          <div class="pw-error" id="pwError">Incorrect password. Try again.</div>
        </div>`;

      const pwInput  = document.getElementById('pwInput');
      const pwSubmit = document.getElementById('pwSubmit');
      const pwError  = document.getElementById('pwError');

      async function submit() {
        const pw = pwInput.value;
        if (!pw) return;
        pwSubmit.disabled = true; pwSubmit.textContent = 'Checking…';
        try {
          const res = await fetch('/api/verify-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ videoId, password: pw })
          });
          const data = await res.json();
          if (data.valid) {
            // For embed videos we don't need to pass the password forward —
            // the iframe URL doesn't go through our server. For uploads we
            // pass it as the `pt` token so /api/video accepts the request.
            if (videoMeta && (videoMeta.platform === 'youtube' || videoMeta.platform === 'vimeo')) {
              showEmbed(videoMeta);
            } else {
              loadVideo(videoId, pw);
            }
          } else {
            pwError.classList.add('visible');
            pwSubmit.disabled = false; pwSubmit.textContent = 'Watch Video';
            pwInput.value = ''; pwInput.focus();
          }
        } catch {
          pwSubmit.disabled = false; pwSubmit.textContent = 'Watch Video';
        }
      }

      pwSubmit.addEventListener('click', submit);
      pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      setTimeout(() => pwInput.focus(), 100);
    }

    function buildVideoUrl(videoId, password) {
      let url = `/api/video/${encodeURIComponent(videoId)}`;
      if (password) url += '?pt=' + encodeURIComponent(password);
      return url;
    }

    async function loadVideo(videoId, password) {
      const videoUrl = buildVideoUrl(videoId, password);
      try {
        const probe = await fetch(videoUrl, { method: 'HEAD' });
        if (probe.status === 403) { showPasswordPrompt(videoId); return; }
        if (probe.status === 410) { showError('This video has expired and is no longer available.', true); return; }
        if (!probe.ok) { showError('This video could not be found.', true); return; }
      } catch {}
      showVideo(videoUrl);
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get('id');
      if (!videoId) { showError('No video ID provided.', true); return; }

      showLoading();

      try {
        const metaRes = await fetch(`/api/video-meta/${encodeURIComponent(videoId)}`);

        if (metaRes.status === 410) {
          showError('This video has expired and is no longer available.', true);
          return;
        }
        if (metaRes.status === 404) {
          showError('This video could not be found. It may have been deleted.', true);
          return;
        }

        if (metaRes.ok) {
          videoMeta = await metaRes.json();
          if (videoMeta.title) {
            videoTitle = videoMeta.title;
            document.title = videoMeta.title + ' – VidShare';
          }
          if (videoMeta.hasPassword) {
            showPasswordPrompt(videoId);
            return;
          }
          // Embed-based videos render the iframe directly. Password-gated ones
          // wait for verification above before reaching this branch.
          if (videoMeta.platform === 'youtube' || videoMeta.platform === 'vimeo') {
            showEmbed(videoMeta);
            return;
          }
        }
      } catch {}

      await loadVideo(videoId, null);
    }

    init();

    document.getElementById('footerUploadBtn').addEventListener('click', () => {
      window.openUploadModal();
    });
  </script>
  <script src="/lib/qrcode-generator.js"></script>
  <script src="/js/upload-widget.js"></script>
  <script src="/js/upload-modal.js"></script>
</body>
</html>
